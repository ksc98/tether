name: iOS sideload build

# Builds the iOS app with real Xcode so the bundle carries Metadata.appintents,
# which Shortcuts needs to list the app's actions. The IPA is the app alone,
# ad-hoc signed; `xtool install` re-signs it for a device.

on:
  push:
    branches: [kyle]
    paths:
      - "apple/**"
      - ".github/workflows/ios-sideload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build
        working-directory: apple
        run: |
          xcodebuild -list -project Tether.xcodeproj
          xcodebuild build \
            -project Tether.xcodeproj \
            -scheme Tether \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Embed entitlements and package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Tether.app"
          test -d "$app/Metadata.appintents"
          plutil -p "$app/Metadata.appintents/extract.actionsdata" | grep -E 'Intent"' | sort -u

          # xtool reads the entitlements to keep from the existing signature. With
          # App Store Connect API-key auth it cannot provision App Groups, and it gives
          # the app and the extension separate keychain groups, so the sideload build
          # drops both the group and the Share Extension that depends on them.
          rm -rf "$app/PlugIns"
          codesign --force --sign - --entitlements apple/Tether-sideload.entitlements "$app"
          codesign -d --entitlements - "$app"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Tether.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Tether-ipa
          path: ${{ runner.temp }}/Tether.ipa
          if-no-files-found: error

      # iOS imports only signed shortcut files, and signing needs macOS. The
      # identifiers are the sideloaded app's: xtool re-signs the bundle as
      # XTL-<id>.<bundle> under the personal team.
      - name: Build and sign the Sync Clipboard shortcut
        env:
          BUNDLE_ID: XTL-E8FE8F29.net.jeedup.Tether
          TEAM_ID: 2DRNAXC5AQ
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shortcut"
          python3 apple/shortcuts/make_sync_shortcut.py \
            --bundle-id "$BUNDLE_ID" --team-id "$TEAM_ID" \
            -o "$RUNNER_TEMP/shortcut/Sync Clipboard.unsigned.shortcut"
          shortcuts sign --mode anyone \
            --input "$RUNNER_TEMP/shortcut/Sync Clipboard.unsigned.shortcut" \
            --output "$RUNNER_TEMP/shortcut/Sync Clipboard.shortcut"
          ls -la "$RUNNER_TEMP/shortcut"

      - uses: actions/upload-artifact@v4
        with:
          name: Sync-Clipboard-shortcut
          path: ${{ runner.temp }}/shortcut/Sync Clipboard.shortcut
          if-no-files-found: error
